services:
  - type: web
    name: messpulse-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: COOKIE_SAME_SITE
        value: none
      - key: DB_POOL_MAX
        value: 10
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: COOKIE_SECRET
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_REG_NO
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
